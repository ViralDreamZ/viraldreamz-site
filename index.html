<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Viral DreamZ Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Luckiest+Guy&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      background-color: #120424;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
      background: #120424;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Fond psychédélique fixe qui ne bloque jamais le défilement */
    .bg-aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at var(--mx, 25%) var(--my, 35%), rgba(255, 20, 120, 0.55) 0%, transparent 55%),
        radial-gradient(circle at calc(100% - var(--mx, 25%)) calc(100% - var(--my, 35%)), rgba(0, 225, 255, 0.45) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(123, 31, 162, 0.5) 0%, #100321 80%);
      transition: background 0.08s linear;
    }

    /* Grille rétro en perspective au bas de l'écran */
    .perspective-grid {
      position: fixed;
      left: -25%;
      right: -25%;
      bottom: 0;
      height: 45vh;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 42, 133, 0.18) 1px, transparent 1px),
        linear-gradient(to top, rgba(0, 245, 212, 0.18) 1px, transparent 1px);
      background-size: 48px 36px;
      transform: perspective(360px) rotateX(65deg);
      transform-origin: bottom center;
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9) 10%, transparent 95%);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.9) 10%, transparent 95%);
    }

    /* Effet de lignes CRT subtil */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 1px,
        rgba(0, 0, 0, 0.12) 2px,
        rgba(0, 0, 0, 0.12) 4px
      );
    }

    /* Canvas des particules réactives à la souris et au doigt */
    #trip-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Conteneur principal centré mais toujours défilable en paysage */
    .stage {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 980px;
      margin: auto;
      padding: clamp(2rem, 6vh, 4rem) clamp(0.75rem, 4vw, 2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(1.2rem, 3.5vh, 2.4rem);
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: clamp(0.68rem, 2.7vw, 1.05rem);
      letter-spacing: clamp(0.22em, 1.2vw, 0.48em);
      padding-left: clamp(0.22em, 1.2vw, 0.48em);
      color: #7ef9ff;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.75), 0 0 24px rgba(255, 42, 133, 0.45);
      white-space: nowrap;
      max-width: 100%;
    }

    /* Titre principal psychédélique */
    .logo-title {
      font-family: 'Luckiest Guy', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.15rem, 1vw, 0.5rem);
      width: 100%;
      line-height: 1.05;
      user-select: none;
      filter: drop-shadow(0 0 18px rgba(255, 0, 140, 0.45));
    }

    /* Force VIRAL DREAMZ à rester sur une seule ligne peu importe l'écran */
    .title-line {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      flex-wrap: nowrap;
      max-width: 100%;
      font-size: clamp(1.75rem, 7.6vw, 4.9rem);
    }

    .title-line.studio-line {
      font-size: clamp(1.65rem, 7.2vw, 4.5rem);
    }

    .word-gap {
      display: inline-block;
      width: 0.34em;
    }

    .wacky-char {
      display: inline-block;
      background: linear-gradient(
        180deg,
        #ffb703 0%,
        #ff2a85 48%,
        #00f5d4 92%
      );
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(25, 4, 48, 0.55);
      filter:
        drop-shadow(2px 3px 0px #190430)
        drop-shadow(4px 6px 0px #2b064d)
        drop-shadow(0px 0px 10px rgba(255, 42, 133, 0.45));
      animation:
        charFloat 2.8s ease-in-out infinite,
        gradientShift 5s ease infinite;
      animation-delay: calc(var(--i) * -0.16s);
      transform-origin: center bottom;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wacky-char.big {
      font-size: 1.24em;
    }

    .wacky-char:hover {
      transform: scale(1.22) rotate(-8deg) !important;
    }

    @keyframes charFloat {
      0%, 100% {
        transform: translateY(0) rotate(calc((var(--dir, 1)) * -2deg));
      }
      50% {
        transform: translateY(-6px) rotate(calc((var(--dir, 1)) * 2.5deg));
      }
    }

    @keyframes gradientShift {
      0%, 100% {
        background-position: 0% 0%;
      }
      50% {
        background-position: 100% 100%;
      }
    }

    /* Carte du jeu The Flying Jacuzzi */
    .project-card {
      width: min(100%, 540px);
      background: rgba(18, 8, 42, 0.72);
      border: 1.5px solid rgba(0, 245, 212, 0.55);
      border-radius: 22px;
      padding: clamp(1.4rem, 4vw, 2.4rem) clamp(1rem, 4vw, 2.4rem);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(0, 245, 212, 0.18),
        inset 0 0 24px rgba(255, 42, 133, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.1rem, 3vw, 1.65rem);
      transition: transform 0.15s ease-out, box-shadow 0.2s ease;
    }

    .game-title {
      font-family: 'Bungee Shade', cursive;
      font-size: clamp(1.35rem, 5.6vw, 2.35rem);
      line-height: 1.25;
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(255, 42, 133, 0.75),
        0 0 26px rgba(181, 23, 158, 0.55);
      letter-spacing: 0.04em;
    }

    .coming-soon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.72rem clamp(1.3rem, 5vw, 2.4rem);
      border-radius: 999px;
      background: linear-gradient(90deg, #d946ef 0%, #a855f7 35%, #00f5d4 100%);
      color: #0b0318;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(0.75rem, 2.8vw, 0.98rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow:
        0 0 22px rgba(217, 70, 239, 0.55),
        0 0 28px rgba(0, 245, 212, 0.45);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #0b0318;
      display: inline-block;
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.65;
      }
    }

    /* Ajustements supplémentaires pour le mode paysage sur mobile */
    @media (max-height: 540px) and (orientation: landscape) {
      .stage {
        margin: 0 auto;
        justify-content: flex-start;
        padding-top: 1.4rem;
        padding-bottom: 2.4rem;
        gap: 1rem;
      }

      .title-line {
        font-size: clamp(1.8rem, 5.8vw, 3.1rem);
      }

      .title-line.studio-line {
        font-size: clamp(1.65rem, 5.4vw, 2.85rem);
      }

      .project-card {
        padding: 1.15rem 1.5rem;
        gap: 0.9rem;
      }

      .game-title {
        font-size: clamp(1.25rem, 4vw, 1.8rem);
      }
    }
  </style>
</head>
<body>
  <div class="bg-aurora" id="aurora"></div>
  <div class="perspective-grid"></div>
  <div class="scanlines"></div>
  <canvas id="trip-canvas"></canvas>

  <main class="stage">
    <p class="subtitle">WELCOME TO THE TRIP</p>

    <h1 class="logo-title" aria-label="Viral DreamZ Studio">
      <span class="title-line" id="line-1"></span>
      <span class="title-line studio-line" id="line-2"></span>
    </h1>

    <section class="project-card" id="card">
      <h2 class="game-title">
        THE FLYING<br />JACUZZI
      </h2>
      <div class="coming-soon-pill">
        <span class="dot"></span>
        <span>COMING SOON</span>
        <span class="dot"></span>
      </div>
    </section>
  </main>

  <script>
    // Génération des lettres animées tout en gardant les mots soudés
    function renderWackyLine(elementId, tokens, startIndex) {
      const container = document.getElementById(elementId);
      let idx = startIndex;

      tokens.forEach((token) => {
        if (token.text === ' ') {
          const gap = document.createElement('span');
          gap.className = 'word-gap';
          gap.innerHTML = '&nbsp;';
          container.appendChild(gap);
          return;
        }

        const span = document.createElement('span');
        span.className = 'wacky-char' + (token.big ? ' big' : '');
        span.textContent = token.text;
        span.style.setProperty('--i', idx);
        span.style.setProperty('--dir', idx % 2 === 0 ? 1 : -1);
        container.appendChild(span);
        idx++;
      });

      return idx;
    }

    const line1Tokens = [
      { text: 'V', big: true },
      { text: 'I' },
      { text: 'R' },
      { text: 'A' },
      { text: 'L' },
      { text: ' ' },
      { text: 'D', big: true },
      { text: 'R' },
      { text: 'E' },
      { text: 'A' },
      { text: 'M' },
      { text: 'Z', big: true }
    ];

    const line2Tokens = [
      { text: 'S', big: true },
      { text: 'T' },
      { text: 'U' },
      { text: 'D' },
      { text: 'I' },
      { text: 'O' }
    ];

    const nextIdx = renderWackyLine('line-1', line1Tokens, 0);
    renderWackyLine('line-2', line2Tokens, nextIdx);

    // Effets interactifs de fond, particules psychédéliques et inclinaison 3D
    const canvas = document.getElementById('trip-canvas');
    const ctx = canvas.getContext('2d');
    const aurora = document.getElementById('aurora');
    const card = document.getElementById('card');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const palette = ['#ff2a85', '#00f5d4', '#ffb703', '#b5179e', '#72efdd'];
    const particles = [];

    function spawnParticles(x, y, count) {
      for (let i = 0; i < count; i++) {
        if (particles.length > 90) particles.shift();
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2.4 + 0.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 5 + 2,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 0.9
        });
      }
    }

    function updatePointer(clientX, clientY, burst) {
      const px = ((clientX / width) * 100).toFixed(1) + '%';
      const py = ((clientY / height) * 100).toFixed(1) + '%';
      aurora.style.setProperty('--mx', px);
      aurora.style.setProperty('--my', py);

      spawnParticles(clientX, clientY, burst);

      if (window.innerWidth > 768) {
        const tiltX = ((clientY / height) - 0.5) * -10;
        const tiltY = ((clientX / width) - 0.5) * 10;
        card.style.transform = `perspective(800px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
      } else {
        card.style.transform = 'none';
      }
    }

    window.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY, 2);
    }, { passive: true });

    // Passive: true garantit que le balayage du doigt fait bien descendre la page sur mobile
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updatePointer(e.touches[0].clientX, e.touches[0].clientY, 1);
      }
    }, { passive: true });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.018;
        p.size *= 0.985;

        if (p.alpha <= 0.02) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
