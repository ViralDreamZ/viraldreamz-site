<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral DreamZ Studio — The Flying Jacuzzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Freckle+Face&family=Luckiest+Guy&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #120428;
      color: #ffffff;
      position: relative;
      padding: 24px;
    }

    /* Fond psychédélique fluide multi-couches */
    .psychedelic-bg {
      position: fixed;
      inset: -30%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.85) 0%, transparent 45%),
        radial-gradient(circle at 80% 25%, rgba(0, 245, 212, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 75% 80%, rgba(155, 93, 229, 0.9) 0%, transparent 50%),
        radial-gradient(circle at 25% 80%, rgba(255, 190, 11, 0.65) 0%, transparent 45%),
        linear-gradient(135deg, #3a0ca3 0%, #7209b7 35%, #f72585 70%, #00bbf9 100%);
      filter: blur(35px);
      animation: trippySwirl 14s ease-in-out infinite alternate, hueTrip 18s linear infinite;
      z-index: 0;
    }

    @keyframes trippySwirl {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(8deg) scale(1.15); }
      100% { transform: rotate(-6deg) scale(1.08); }
    }

    @keyframes hueTrip {
      0%   { filter: blur(35px) hue-rotate(0deg) saturate(1.3); }
      50%  { filter: blur(35px) hue-rotate(45deg) saturate(1.6); }
      100% { filter: blur(35px) hue-rotate(0deg) saturate(1.3); }
    }

    /* Assombrissement central léger pour faire ressortir les néons */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 6, 38, 0.35) 0%, rgba(8, 3, 20, 0.72) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Grille synthwave animée au bas */
    .retro-grid {
      position: fixed;
      bottom: -24%;
      left: -25%;
      width: 150%;
      height: 60%;
      background-image:
        linear-gradient(rgba(255, 42, 133, 0.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 212, 0.28) 1px, transparent 1px);
      background-size: 54px 54px;
      transform: perspective(360px) rotateX(68deg);
      animation: gridFlow 3.2s linear infinite;
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent 85%);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent 85%);
      pointer-events: none;
      z-index: 2;
    }

    @keyframes gridFlow {
      from { background-position: 0 0; }
      to   { background-position: 0 54px; }
    }

    /* Canevas d'effets psychédéliques au passage de la souris */
    #psy-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 3;
    }

    /* Lignes d'écran CRT rétro */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 5;
    }

    main {
      position: relative;
      z-index: 4;
      max-width: 980px;
      width: 100%;
    }

    .tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.78rem, 1.5vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: #72efdd;
      text-shadow: 0 0 12px rgba(114, 239, 221, 0.85), 0 0 24px rgba(247, 37, 133, 0.6);
      margin-bottom: 1.3rem;
    }

    /* Lettrage loufoque et déjanté avec gros V, D, Z et S */
    h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(2.6rem, 7vw, 5.2rem);
      line-height: 1.12;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2.4rem;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #ff70a6, #ffbe0b, #00f5d4);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(-4px 4px 0px #f72585)
        drop-shadow(3px -2px 0px #3a0ca3)
        drop-shadow(0 0 20px rgba(0, 245, 212, 0.6));
      animation: logoShimmer 6s linear infinite;
    }

    @keyframes logoShimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 250% center; }
    }

    /* Style commun aux grosses lettres loufoques V, D, Z, S */
    .wacky-big {
      display: inline-block;
      font-family: 'Freckle Face', cursive;
      font-size: 1.42em;
      line-height: 0.78;
      background: linear-gradient(180deg, #ffbe0b 0%, #ff007f 52%, #00f5d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(4px 4px 0px #240046)
        drop-shadow(0 0 18px rgba(255, 0, 127, 0.9));
    }

    .letter-v {
      margin-right: 0.01em;
      animation: wackyV 2.4s ease-in-out infinite alternate;
    }

    .letter-d {
      margin-left: 0.14em;
      margin-right: 0.01em;
      animation: wackyD 2.7s ease-in-out infinite alternate;
    }

    .letter-z {
      margin-left: 0.02em;
      animation: wackyZ 2.2s ease-in-out infinite alternate;
    }

    .letter-s {
      margin-right: 0.02em;
      animation: wackyS 2.5s ease-in-out infinite alternate;
    }

    @keyframes wackyV {
      0%   { transform: rotate(-10deg) translateY(0.02em) scale(1.02); }
      100% { transform: rotate(-3deg) translateY(-0.05em) scale(1.12); }
    }

    @keyframes wackyD {
      0%   { transform: rotate(7deg) translateY(-0.03em) scale(1.05); }
      100% { transform: rotate(-5deg) translateY(0.04em) scale(1.13); }
    }

    @keyframes wackyZ {
      0%   { transform: rotate(-9deg) translateY(0.03em) scale(1.04); }
      100% { transform: rotate(6deg) translateY(-0.04em) scale(1.15); }
    }

    @keyframes wackyS {
      0%   { transform: rotate(-8deg) translateY(-0.02em) scale(1.03); }
      100% { transform: rotate(5deg) translateY(0.04em) scale(1.12); }
    }

    .studio-line {
      display: block;
      font-size: 0.88em;
      letter-spacing: 0.12em;
      margin-top: 0.15em;
    }

    /* Carte néon du jeu */
    .game-card {
      display: inline-block;
      padding: clamp(1.6rem, 3.8vw, 2.5rem) clamp(1.8rem, 5.2vw, 4rem);
      background: rgba(14, 7, 32, 0.78);
      border: 2px solid rgba(0, 245, 212, 0.55);
      border-radius: 22px;
      box-shadow:
        0 0 35px rgba(247, 37, 133, 0.45),
        0 0 60px rgba(0, 245, 212, 0.25),
        inset 0 0 25px rgba(155, 93, 229, 0.28);
      backdrop-filter: blur(10px);
    }

    .game-title {
      font-family: 'Bungee Shade', cursive;
      font-size: clamp(1.45rem, 4.2vw, 3rem);
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow:
        0 0 12px #f72585,
        0 0 28px #7209b7,
        0 0 42px #00f5d4;
      margin-bottom: 1.5rem;
    }

    /* Bouton COMING SOON réactif au survol de la souris */
    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.65rem 1.7rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffbe0b, #ff007f, #9b5de5, #00f5d4, #ffbe0b);
      background-size: 300% 100%;
      color: #0b051d;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.78rem, 1.4vw, 0.95rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      box-shadow:
        0 0 18px rgba(255, 0, 127, 0.75),
        0 0 26px rgba(0, 245, 212, 0.6);
      animation: gradientFlow 4s linear infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .coming-soon:hover {
      animation:
        gradientFlow 1.2s linear infinite,
        jellyDance 0.55s ease-in-out infinite;
      box-shadow:
        0 0 28px #ffbe0b,
        0 0 45px #ff007f,
        0 0 65px #00f5d4;
    }

    @keyframes gradientFlow {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes jellyDance {
      0%   { transform: scale(1.12) rotate(0deg) translateY(-4px); }
      25%  { transform: scale(1.16, 1.06) rotate(-4deg) translateY(-7px); }
      50%  { transform: scale(1.08, 1.18) rotate(4deg) translateY(-3px); }
      75%  { transform: scale(1.15, 1.08) rotate(-3deg) translateY(-6px); }
      100% { transform: scale(1.12) rotate(0deg) translateY(-4px); }
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #0b051d;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="psychedelic-bg"></div>
  <div class="vignette"></div>
  <div class="retro-grid"></div>
  <canvas id="psy-canvas"></canvas>

  <main>
    <div class="tagline">Welcome to the trip</div>
    <h1>
      <span class="wacky-big letter-v">V</span>iral
      <span class="wacky-big letter-d">D</span>ream<span class="wacky-big letter-z">Z</span>
      <span class="studio-line">
        <span class="wacky-big letter-s">S</span>tudio
      </span>
    </h1>

    <div class="game-card">
      <div class="game-title">The Flying Jacuzzi</div>
      <div class="coming-soon">
        <span class="dot"></span>
        Coming Soon
        <span class="dot"></span>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('psy-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const effects = [];
    let baseHue = 0;
    let lastSpawn = 0;

    function spawnPsychedelicEffect(x, y, scaleBoost = 1) {
      baseHue = (baseHue + 23) % 360;

      // Gros nuage de plasma multicolore
      effects.push({
        type: 'plasma',
        x: x + (Math.random() - 0.5) * 20,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() - 0.5) * 1.8,
        radius: 35 * scaleBoost,
        maxRadius: (130 + Math.random() * 90) * scaleBoost,
        hue1: baseHue,
        hue2: (baseHue + 110) % 360,
        hue3: (baseHue + 220) % 360,
        alpha: 0.85,
        decay: 0.013
      });

      // Anneau psychédélique ondulant (forme fleur / kaléidoscope)
      effects.push({
        type: 'waveRing',
        x,
        y,
        radius: 20 * scaleBoost,
        maxRadius: (145 + Math.random() * 85) * scaleBoost,
        hue: (baseHue + 55) % 360,
        lobes: 5 + Math.floor(Math.random() * 5),
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        alpha: 0.95,
        decay: 0.016
      });
    }

    window.addEventListener('mousemove', (e) => {
      const now = performance.now();
      if (now - lastSpawn > 22) {
        spawnPsychedelicEffect(e.clientX, e.clientY, 1);
        lastSpawn = now;
      }
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      if (touch) {
        spawnPsychedelicEffect(touch.clientX, touch.clientY, 1);
      }
    }, { passive: true });

    window.addEventListener('click', (e) => {
      for (let i = 0; i < 3; i++) {
        spawnPsychedelicEffect(e.clientX, e.clientY, 1.6);
      }
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = effects.length - 1; i >= 0; i--) {
        const p = effects[i];
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          effects.splice(i, 1);
          continue;
        }

        if (p.type === 'plasma') {
          p.x += p.vx;
          p.y += p.vy;
          p.radius += (p.maxRadius - p.radius) * 0.07;
          p.hue1 = (p.hue1 + 3) % 360;
          p.hue2 = (p.hue2 + 4) % 360;

          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
          grad.addColorStop(0, `hsla(${p.hue1}, 100%, 68%, ${p.alpha * 0.75})`);
          grad.addColorStop(0.45, `hsla(${p.hue2}, 100%, 58%, ${p.alpha * 0.5})`);
          grad.addColorStop(0.8, `hsla(${p.hue3}, 100%, 50%, ${p.alpha * 0.22})`);
          grad.addColorStop(1, `hsla(${p.hue3}, 100%, 50%, 0)`);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'waveRing') {
          p.radius += (p.maxRadius - p.radius) * 0.08;
          p.rotation += p.rotSpeed;
          p.hue = (p.hue + 5) % 360;

          ctx.save();
          ctx.beginPath();
          const steps = 72;
          for (let s = 0; s <= steps; s++) {
            const angle = (s / steps) * Math.PI * 2;
            const wave = Math.sin(angle * p.lobes + p.rotation * 3) * (p.radius * 0.16);
            const r = p.radius + wave;
            const px = p.x + Math.cos(angle + p.rotation) * r;
            const py = p.y + Math.sin(angle + p.rotation) * r;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.strokeStyle = `hsla(${p.hue}, 100%, 65%, ${p.alpha})`;
          ctx.lineWidth = 3.5;
          ctx.shadowBlur = 18;
          ctx.shadowColor = `hsla(${(p.hue + 60) % 360}, 100%, 60%, ${p.alpha})`;
          ctx.stroke();
          ctx.restore();
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
